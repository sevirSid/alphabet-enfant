<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alphabet Magique</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #b8e7ff, #ffffff);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .app{
      width:100%;
      max-width:600px;
      background:white;
      border-radius:30px;
      padding:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.12);
      text-align:center;
    }

    h1{
      color:#ff4d6d;
      margin-bottom:10px;
      font-size:2.5rem;
    }

    .subtitle{
      color:#666;
      margin-bottom:25px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .score,
    .level{
      background:#f1f5ff;
      padding:10px 15px;
      border-radius:15px;
      font-weight:bold;
      color:#333;
    }

    .card{
      background:#fff7d6;
      border-radius:25px;
      padding:30px;
      margin-bottom:25px;
    }

    .letter{
      font-size:120px;
      color:#3a86ff;
      font-weight:bold;
      animation:bounce 1s infinite alternate;
    }

    .lowercase{
      font-size:50px;
      color:#777;
      margin-top:-15px;
      margin-bottom:15px;
    }

    .emoji{
      font-size:90px;
      margin:20px 0;
    }

    .word{
      font-size:2rem;
      color:#333;
      font-weight:bold;
    }

    .question{
      margin:25px 0;
      font-size:1.4rem;
      color:#444;
    }

    .choices{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .choice{
      border:none;
      border-radius:20px;
      padding:18px;
      font-size:1.5rem;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
      background:#ffd166;
    }

    .choice:hover{
      transform:scale(1.05);
    }

    .message{
      margin-top:20px;
      font-size:1.5rem;
      min-height:40px;
      font-weight:bold;
    }

    .next{
      margin-top:20px;
      width:100%;
      border:none;
      background:#06d6a0;
      color:white;
      padding:18px;
      border-radius:20px;
      font-size:1.2rem;
      font-weight:bold;
      cursor:pointer;
      display:none;
    }

    .listen{
      margin-top:15px;
      border:none;
      background:#3a86ff;
      color:white;
      padding:12px 18px;
      border-radius:15px;
      cursor:pointer;
      font-size:1rem;
    }

    .progress{
      margin-top:25px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
    }

    .dot{
      width:20px;
      height:20px;
      border-radius:50%;
      background:#ddd;
    }

    .done{
      background:#06d6a0;
    }

    @keyframes bounce{
      from{
        transform:translateY(0px);
      }

      to{
        transform:translateY(-10px);
      }
    }

    .final{
      padding:40px 20px;
    }

    .final h2{
      font-size:3rem;
      margin-bottom:20px;
      color:#ff4d6d;
    }

    .restart{
      margin-top:30px;
      border:none;
      background:#3a86ff;
      color:white;
      padding:18px 30px;
      border-radius:20px;
      font-size:1.2rem;
      cursor:pointer;
    }

    @media(max-width:500px){

      .letter{
        font-size:90px;
      }

      .emoji{
        font-size:70px;
      }

      .word{
        font-size:1.5rem;
      }

      .choice{
        font-size:1.2rem;
      }
    }

  </style>
</head>

<body>

<div class="app" id="app">

  <h1>🌈 Alphabet Magique</h1>

  <p class="subtitle">
    Apprends les lettres en t'amusant !
  </p>

  <div class="top">
    <div class="score">
      ⭐ Score : <span id="score">0</span>
    </div>

    <div class="level">
      Lettre : <span id="level">1</span>
    </div>
  </div>

  <div class="card">

    <div class="letter" id="letter">A</div>

    <div class="lowercase" id="lowercase">a</div>

    <div class="emoji" id="emoji">✈️</div>

    <div class="word" id="word">
      Avion
    </div>

    <button class="listen" id="listenBtn">
      🔊 Écouter
    </button>

  </div>

  <div class="question">
    Quelle est la bonne lettre ?
  </div>

  <div class="choices" id="choices"></div>

  <div class="message" id="message"></div>

  <button class="next" id="nextBtn">
    Lettre suivante ➜
  </button>

  <div class="progress" id="progress"></div>

</div>

  <script>

const alphabet = [
  { letter:"A", word:"Avion", emoji:"✈️" },
  { letter:"B", word:"Banane", emoji:"🍌" },
  { letter:"C", word:"Chat", emoji:"🐱" },
  { letter:"D", word:"Dauphin", emoji:"🐬" },
  { letter:"E", word:"Éléphant", emoji:"🐘" },
  { letter:"F", word:"Fraise", emoji:"🍓" },
  { letter:"G", word:"Gâteau", emoji:"🎂" },
  { letter:"H", word:"Hérisson", emoji:"🦔" },
  { letter:"I", word:"Igloo", emoji:"🧊" },
  { letter:"J", word:"Jus", emoji:"🧃" },
  { letter:"K", word:"Koala", emoji:"🐨" },
  { letter:"L", word:"Lion", emoji:"🦁" },
  { letter:"M", word:"Maison", emoji:"🏠" },
  { letter:"N", word:"Nuage", emoji:"☁️" },
  { letter:"O", word:"Oiseau", emoji:"🐦" },
  { letter:"P", word:"Pizza", emoji:"🍕" },
  { letter:"Q", word:"Quille", emoji:"🎳" },
  { letter:"R", word:"Robot", emoji:"🤖" },
  { letter:"S", word:"Soleil", emoji:"☀️" },
  { letter:"T", word:"Tortue", emoji:"🐢" },
  { letter:"U", word:"Usine", emoji:"🏭" },
  { letter:"V", word:"Voiture", emoji:"🚗" },
  { letter:"W", word:"Wagon", emoji:"🚃" },
  { letter:"X", word:"Xylophone", emoji:"🎼" },
  { letter:"Y", word:"Yaourt", emoji:"🥛" },
  { letter:"Z", word:"Zèbre", emoji:"🦓" }
];

let current = 0;
let score = 0;

const letter = document.getElementById("letter");
const lowercase = document.getElementById("lowercase");
const emoji = document.getElementById("emoji");
const word = document.getElementById("word");
const choices = document.getElementById("choices");
const message = document.getElementById("message");
const nextBtn = document.getElementById("nextBtn");
const scoreText = document.getElementById("score");
const level = document.getElementById("level");
const progress = document.getElementById("progress");
const listenBtn = document.getElementById("listenBtn");

let frenchVoice = null;

function loadFrenchVoice(){

  const voices = speechSynthesis.getVoices();

  frenchVoice = voices.find(v =>
    v.lang.includes("fr")
  );

}

speechSynthesis.onvoiceschanged = loadFrenchVoice;

loadFrenchVoice();

function speak(text){

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "fr-FR";

  speech.rate = 0.85;

  speech.pitch = 1.1;

  if(frenchVoice){
    speech.voice = frenchVoice;
  }

  speechSynthesis.speak(speech);
}

listenBtn.onclick = () => {

  const data = alphabet[current];

  speak(
    data.letter +
    " comme " +
    data.word
  );
};

function shuffle(array){

  return array.sort(() => Math.random() - 0.5);
}

function generateChoices(correctLetter){

  const allLetters = alphabet.map(a => a.letter);

  const wrongChoices = shuffle(
    allLetters.filter(l => l !== correctLetter)
  ).slice(0,3);

  const finalChoices = shuffle([
    correctLetter,
    ...wrongChoices
  ]);

  return finalChoices;
}

function renderProgress(){

  progress.innerHTML = "";

  alphabet.forEach((_, index) => {

    const dot = document.createElement("div");

    dot.classList.add("dot");

    if(index < current){
      dot.classList.add("done");
    }

    progress.appendChild(dot);
  });
}

function loadQuestion(){

  const data = alphabet[current];

  letter.textContent = data.letter;

  lowercase.textContent =
    data.letter.toLowerCase();

  emoji.textContent = data.emoji;

  word.textContent = data.word;

  level.textContent =
    `${current + 1}/${alphabet.length}`;

  message.textContent = "";

  nextBtn.style.display = "none";

  choices.innerHTML = "";

  const generated =
    generateChoices(data.letter);

  generated.forEach(choice => {

    const btn = document.createElement("button");

    btn.classList.add("choice");

    btn.textContent = choice;

    btn.onclick = () =>
      checkAnswer(choice);

    choices.appendChild(btn);
  });

  renderProgress();
}

function checkAnswer(choice){

  const correct =
    alphabet[current].letter;

  if(choice === correct){

    score++;

    scoreText.textContent = score;

    message.innerHTML =
      "🎉 Bravo !";

    message.style.color = "green";

    speak("Bravo");

    nextBtn.style.display = "block";

  }else{

    message.innerHTML =
      "😊 Essaie encore";

    message.style.color = "red";

    speak("Essaie encore");
  }
}

nextBtn.onclick = () => {

  current++;

  if(current >= alphabet.length){

    document.getElementById("app").innerHTML = `
      <div class="final">

        <h2>🏆 Bravo !</h2>

        <p style="font-size:1.5rem;">
          Tu as terminé l'alphabet !
        </p>

        <p style="
          margin-top:20px;
          font-size:2rem;
          color:#06d6a0;
          font-weight:bold;
        ">
          ⭐ ${score}/${alphabet.length}
        </p>

        <button
          class="restart"
          onclick="location.reload()"
        >
          Rejouer 🔄
        </button>

      </div>
    `;

    speak("Bravo tu as terminé");

    return;
  }

  loadQuestion();
};

loadQuestion();

</script>

</body>
</html>
