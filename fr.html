<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alphabet Magique</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:   #ff4d6d;
      --blue:   #3a86ff;
      --green:  #06d6a0;
      --yellow: #ffd166;
      --purple: #c77dff;
      --orange: #ff9f1c;
      --bg:     #e8f4fd;
      --card-bg:#fff9e6;
      --white:  #ffffff;
      --text:   #2d3436;
      --shadow: 0 8px 32px rgba(58,134,255,0.13);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Nunito',sans-serif;
      background:var(--bg);
      min-height:100vh;
      display:flex;justify-content:center;align-items:center;
      padding:20px;
      background-image:
        radial-gradient(circle at 15% 20%,rgba(255,77,109,.10) 0%,transparent 50%),
        radial-gradient(circle at 85% 80%,rgba(58,134,255,.12) 0%,transparent 50%),
        radial-gradient(circle at 50% 50%,rgba(6,214,160,.08)  0%,transparent 70%);
    }
    .app{
      width:100%;max-width:560px;
      background:var(--white);border-radius:36px;
      padding:32px 28px 28px;
      box-shadow:var(--shadow),0 2px 0 rgba(0,0,0,.04);
      text-align:center;position:relative;overflow:hidden;
    }
    .app::before{
      content:'';position:absolute;top:0;left:0;right:0;height:6px;
      background:linear-gradient(90deg,var(--pink),var(--yellow),var(--green),var(--blue),var(--purple));
      border-radius:36px 36px 0 0;
    }
    h1{font-family:'Baloo 2',cursive;color:var(--pink);font-size:2.4rem;font-weight:800;margin-bottom:4px;}
    .subtitle{color:#888;font-size:.95rem;margin-bottom:18px;}
    .mode-badge{
      display:inline-block;margin-bottom:14px;padding:6px 14px;border-radius:20px;
      font-size:.85rem;font-weight:800;
    }
    .mode-badge.full{background:#e8f4ff;color:var(--blue);}
    .mode-badge.weak{background:#fff3e0;color:var(--orange);}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;}
    .badge{
      background:#f1f5ff;padding:9px 14px;border-radius:14px;
      font-weight:700;color:var(--text);font-size:.95rem;flex:1;text-align:center;
    }
    .lives{display:flex;gap:4px;background:#fff0f3;padding:9px 14px;border-radius:14px;}
    .heart{font-size:1.3rem;transition:transform .3s;}
    .heart.lost{filter:grayscale(1) opacity(.35);transform:scale(.85);}
    .card{
      background:var(--card-bg);border-radius:26px;padding:24px 20px 20px;
      margin-bottom:22px;border:3px solid #ffe9a0;
    }
    .card.fade-in{animation:fadeIn .4s ease forwards;}
    @keyframes fadeIn{
      from{opacity:0;transform:scale(.96) translateY(8px);}
      to  {opacity:1;transform:scale(1)   translateY(0);}
    }
    .letters-row{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:4px;}
    .letter{
      font-family:'Baloo 2',cursive;font-size:110px;color:var(--blue);font-weight:800;line-height:1;
      animation:bounce 1.4s ease-in-out infinite alternate;
    }
    .lowercase{
      font-family:'Baloo 2',cursive;font-size:72px;color:var(--purple);font-weight:800;line-height:1;
      animation:bounce 1.4s ease-in-out infinite alternate .2s;
    }
    @keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-10px);}}
    .emoji{font-size:76px;margin:10px 0 8px;display:block;}
    .word{font-size:1.9rem;color:var(--text);font-weight:900;}
    .listen-row{margin-top:14px;}
    .listen{
      border:none;background:var(--blue);color:white;
      padding:10px 20px;border-radius:12px;cursor:pointer;
      font-size:.95rem;font-weight:700;font-family:'Nunito',sans-serif;
      transition:transform .15s,background .15s;
    }
    .listen:hover{transform:scale(1.06);background:#2176f5;}
    .listen:active{transform:scale(.97);}
    .question{margin:0 0 16px;font-size:1.25rem;color:#555;font-weight:700;}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .choice{
      border:3px solid transparent;border-radius:18px;padding:16px 10px;
      font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;
      cursor:pointer;background:var(--yellow);color:var(--text);
      box-shadow:0 4px 0 rgba(0,0,0,.08);
      transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;
    }
    .choice:hover:not(:disabled){transform:translateY(-3px) scale(1.04);box-shadow:0 8px 18px rgba(255,209,102,.4);}
    .choice:active:not(:disabled){transform:scale(.97);}
    .choice:disabled{cursor:not-allowed;}
    .choice.correct{background:var(--green);color:white;border-color:#04b889;animation:popCorrect .4s ease forwards;}
    .choice.wrong  {background:var(--pink); color:white;border-color:#e03050;animation:shake .4s ease forwards;}
    @keyframes popCorrect{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
      60%{transform:translateX(-5px);}80%{transform:translateX(5px);}
    }
    .message{margin-top:18px;font-size:1.4rem;min-height:38px;font-weight:900;}
    .next{
      margin-top:16px;width:100%;border:none;
      background:linear-gradient(135deg,var(--green),#04b889);
      color:white;padding:18px;border-radius:20px;
      font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:800;
      cursor:pointer;display:none;box-shadow:0 4px 0 #04a07a;transition:transform .15s;
    }
    .next:hover{transform:translateY(-2px);}
    .next:active{transform:translateY(1px);box-shadow:0 2px 0 #04a07a;}
    .progress{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
    .dot{width:16px;height:16px;border-radius:50%;background:#e0e7ef;transition:background .3s,transform .3s;}
    .dot.done     {background:var(--green);transform:scale(1.1);}
    .dot.done.weak{background:var(--orange);}
    .dot.curr     {background:var(--blue);transform:scale(1.2);box-shadow:0 0 0 3px rgba(58,134,255,.2);}
    .weak-panel{
      margin-top:20px;background:#fff8f0;border:2px solid #ffe0b2;
      border-radius:18px;padding:14px 16px;text-align:left;
    }
    .weak-panel h3{font-size:1rem;color:var(--orange);margin-bottom:10px;font-weight:800;}
    .weak-letters{display:flex;flex-wrap:wrap;gap:8px;}
    .weak-tag{
      background:white;border:2px solid #ffcc80;border-radius:10px;
      padding:4px 12px;font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;color:var(--orange);
    }
    .best-banner{margin-top:12px;font-size:.88rem;color:#aaa;}
    .final{padding:36px 10px 20px;}
    .final h2{font-family:'Baloo 2',cursive;font-size:2.8rem;margin-bottom:14px;color:var(--pink);font-weight:800;}
    .final-score{margin-top:18px;font-size:2.2rem;color:var(--green);font-weight:900;}
    .star-row{font-size:2.5rem;margin:10px 0;letter-spacing:4px;}
    .weak-summary{margin-top:20px;background:#fff8f0;border:2px solid #ffe0b2;border-radius:18px;padding:14px 16px;}
    .weak-summary h3{font-size:1rem;color:var(--orange);margin-bottom:10px;font-weight:800;}
    .btn-row{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
    .restart,.retry-weak{
      border:none;padding:18px 24px;border-radius:20px;
      font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;
      cursor:pointer;transition:transform .15s;
    }
    .restart    {background:linear-gradient(135deg,var(--blue),#2176f5);color:white;box-shadow:0 4px 0 #1a5fd4;}
    .retry-weak {background:linear-gradient(135deg,var(--orange),#f08000);color:white;box-shadow:0 4px 0 #c06a00;}
    .restart:hover,.retry-weak:hover  {transform:translateY(-2px);}
    .restart:active,.retry-weak:active{transform:translateY(1px);}
    .confetti-wrap{position:fixed;top:0;left:0;right:0;pointer-events:none;overflow:hidden;height:100vh;z-index:999;}
    .confetti-piece{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;opacity:0;animation:fall linear forwards;}
    @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(110vh) rotate(720deg);}}
    @media(max-width:480px){
      h1{font-size:1.9rem;}.letter{font-size:84px;}.lowercase{font-size:56px;}
      .emoji{font-size:60px;}.word{font-size:1.5rem;}.choice{font-size:1.5rem;padding:14px 8px;}
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     SINGLE persistent container — never replaced
════════════════════════════════════════ -->
<div class="app" id="app">

  <!-- GAME VIEW -->
  <div id="gameView">
    <h1>🌈 Alphabet Magique</h1>
    <p class="subtitle">Apprends les lettres en t'amusant !</p>
    <div id="modeBadgeWrap"></div>
    <div class="top">
      <div class="badge">⭐ Score : <span id="score">0</span></div>
      <div class="lives" id="lives"></div>
      <div class="badge">Lettre <span id="level">1/26</span></div>
    </div>
    <div class="card" id="card">
      <div class="letters-row">
        <div class="letter"    id="letter">A</div>
        <div class="lowercase" id="lowercase">a</div>
      </div>
      <span class="emoji" id="emoji">✈️</span>
      <div class="word"   id="word">Avion</div>
      <div class="listen-row">
        <button class="listen" id="listenBtn">🔊 Écouter</button>
      </div>
    </div>
    <div class="question">Quelle est la bonne lettre ?</div>
    <div class="choices"  id="choices"></div>
    <div class="message"  id="message"></div>
    <button class="next"  id="nextBtn">Lettre suivante ➜</button>
    <div class="progress" id="progress"></div>
    <div class="best-banner" id="bestBanner"></div>
    <div id="weakPanelWrap"></div>
  </div>

  <!-- FINAL VIEW (hidden initially) -->
  <div id="finalView" style="display:none;">
    <div class="final">
      <h2>🏆 Bravo !</h2>
      <p id="finalSubtitle" style="font-size:1.3rem;color:#555;"></p>
      <div class="star-row" id="finalStars"></div>
      <div class="final-score" id="finalScore"></div>
      <p id="finalBest" style="margin-top:8px;color:#aaa;font-size:.85rem;"></p>
      <div id="finalWeakSummary"></div>
      <div class="btn-row">
        <button class="retry-weak" id="retryWeakBtn" style="display:none;">🔥 Retravailler les lettres difficiles</button>
        <button class="restart"    id="restartBtn">Rejouer tout l'alphabet 🔄</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
const alphabet = [
  {letter:"A",word:"Avion",    emoji:"✈️"},
  {letter:"B",word:"Banane",   emoji:"🍌"},
  {letter:"C",word:"Chat",     emoji:"🐱"},
  {letter:"D",word:"Dauphin",  emoji:"🐬"},
  {letter:"E",word:"Éléphant", emoji:"🐘"},
  {letter:"F",word:"Fraise",   emoji:"🍓"},
  {letter:"G",word:"Gâteau",   emoji:"🎂"},
  {letter:"H",word:"Hérisson", emoji:"🦔"},
  {letter:"I",word:"Igloo",    emoji:"🧊"},
  {letter:"J",word:"Jus",      emoji:"🧃"},
  {letter:"K",word:"Koala",    emoji:"🐨"},
  {letter:"L",word:"Lion",     emoji:"🦁"},
  {letter:"M",word:"Maison",   emoji:"🏠"},
  {letter:"N",word:"Nuage",    emoji:"☁️"},
  {letter:"O",word:"Oiseau",   emoji:"🐦"},
  {letter:"P",word:"Pizza",    emoji:"🍕"},
  {letter:"Q",word:"Quille",   emoji:"🎳"},
  {letter:"R",word:"Robot",    emoji:"🤖"},
  {letter:"S",word:"Soleil",   emoji:"☀️"},
  {letter:"T",word:"Tortue",   emoji:"🐢"},
  {letter:"U",word:"Usine",    emoji:"🏭"},
  {letter:"V",word:"Voiture",  emoji:"🚗"},
  {letter:"W",word:"Wagon",    emoji:"🚃"},
  {letter:"X",word:"Xylophone",emoji:"🎼"},
  {letter:"Y",word:"Yoyo",     emoji:"🪀"},
  {letter:"Z",word:"Zèbre",    emoji:"🦓"},
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let currentIdx       = 0;
let score            = 0;
let lives            = 3;
let answered         = false;
let mistakeThisRound = false;
let mode             = 'full';
let queue            = [];   // alphabet indices

/* ══════════════════════════════════════
   WEAK LETTERS
══════════════════════════════════════ */
function getWeak(){
  try{ return JSON.parse(localStorage.getItem("alphabetWeak")||"{}"); }catch(e){ return {}; }
}
function saveWeak(obj){ localStorage.setItem("alphabetWeak",JSON.stringify(obj)); }
function markWeak(letter){
  const w=getWeak(); w[letter]=(w[letter]||0)+1; saveWeak(w);
}
function markMastered(letter){
  const w=getWeak();
  if(w[letter]){ w[letter]=Math.max(0,w[letter]-1); if(!w[letter]) delete w[letter]; saveWeak(w); }
}
function getWeakLetters(){
  return Object.entries(getWeak()).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
}

/* ══════════════════════════════════════
   BEST SCORE
══════════════════════════════════════ */
function getBest(){ return parseInt(localStorage.getItem("alphabetBest")||"0"); }
function setBest(v){ localStorage.setItem("alphabetBest",v); }

/* ══════════════════════════════════════
   QUEUE
══════════════════════════════════════ */
function buildQueue(m){
  mode = m;
  if(m==='weak'){
    queue = getWeakLetters().map(l=>alphabet.findIndex(a=>a.letter===l)).filter(i=>i>=0);
  } else {
    queue = alphabet.map((_,i)=>i);
  }
  currentIdx=0; score=0;
}

/* ══════════════════════════════════════
   VIEWS
══════════════════════════════════════ */
function showGame(){
  document.getElementById("gameView").style.display="";
  document.getElementById("finalView").style.display="none";
}
function showFinal(){
  document.getElementById("gameView").style.display="none";
  document.getElementById("finalView").style.display="";
}

/* ══════════════════════════════════════
   SPEECH
══════════════════════════════════════ */
let frVoice=null;
function loadVoices(){ frVoice=speechSynthesis.getVoices().find(x=>x.lang.startsWith("fr"))||null; }
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="fr-FR"; u.rate=0.85; u.pitch=1.1;
  if(frVoice) u.voice=frVoice;
  speechSynthesis.speak(u);
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function generateChoices(correct){
  const others=shuffle(alphabet.map(a=>a.letter).filter(l=>l!==correct)).slice(0,3);
  return shuffle([correct,...others]);
}

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function renderLives(){
  const el=document.getElementById("lives");
  el.innerHTML="";
  for(let i=0;i<3;i++){
    const h=document.createElement("span");
    h.className="heart"+(i>=lives?" lost":"");
    h.textContent="❤️";
    el.appendChild(h);
  }
}

function renderProgress(){
  const el=document.getElementById("progress");
  el.innerHTML="";
  const w=getWeak();
  queue.forEach((alphaIdx,i)=>{
    const letter=alphabet[alphaIdx].letter;
    const d=document.createElement("div");
    let cls="dot";
    if(i<currentIdx)        cls+=" done"+(w[letter]?" weak":"");
    else if(i===currentIdx) cls+=" curr";
    d.className=cls; d.title=letter;
    el.appendChild(d);
  });
}

function renderModeBadge(){
  const el=document.getElementById("modeBadgeWrap");
  el.innerHTML=mode==='weak'
    ?'<span class="mode-badge weak">🔥 Mode révision — lettres difficiles</span>'
    :'<span class="mode-badge full">📚 Mode complet — tout l\'alphabet</span>';
}

function renderWeakPanel(){
  const el=document.getElementById("weakPanelWrap");
  const wl=getWeakLetters();
  if(!wl.length){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="weak-panel">
    <h3>🔴 Lettres à retravailler</h3>
    <div class="weak-letters">${wl.map(l=>`<span class="weak-tag">${l}</span>`).join("")}</div>
  </div>`;
}

function updateBestBanner(){
  const b=getBest();
  document.getElementById("bestBanner").textContent=b>0?`🏅 Meilleur score : ${b}/${alphabet.length}`:"";
}

/* ══════════════════════════════════════
   LOAD QUESTION
══════════════════════════════════════ */
function loadQuestion(){
  answered=false; mistakeThisRound=false; lives=3;
  showGame();

  const data=alphabet[queue[currentIdx]];
  document.getElementById("letter").textContent   = data.letter;
  document.getElementById("lowercase").textContent= data.letter.toLowerCase();
  document.getElementById("emoji").textContent    = data.emoji;
  document.getElementById("word").textContent     = data.word;
  document.getElementById("level").textContent    = `${currentIdx+1}/${queue.length}`;
  document.getElementById("score").textContent    = score;
  document.getElementById("message").textContent  = "";
  document.getElementById("nextBtn").style.display= "none";

  /* Choices */
  const choicesEl=document.getElementById("choices");
  choicesEl.innerHTML="";
  generateChoices(data.letter).forEach(ch=>{
    const btn=document.createElement("button");
    btn.className="choice"; btn.textContent=ch;
    btn.onclick=()=>checkAnswer(ch,btn);
    choicesEl.appendChild(btn);
  });

  renderProgress();
  renderLives();
  renderModeBadge();
  renderWeakPanel();
  updateBestBanner();

  const card=document.getElementById("card");
  card.classList.remove("fade-in");
  void card.offsetWidth;
  card.classList.add("fade-in");

  setTimeout(()=>speak(`${data.letter} comme ${data.word}`),300);
}

/* ══════════════════════════════════════
   CHECK ANSWER
══════════════════════════════════════ */
function checkAnswer(choice,btn){
  if(answered) return;
  const correct=alphabet[queue[currentIdx]].letter;
  const msgEl=document.getElementById("message");

  if(choice===correct){
    answered=true;
    btn.classList.add("correct");
    score++; document.getElementById("score").textContent=score;
    msgEl.innerHTML=mistakeThisRound?"✅ Bien rattrapé !":"🎉 Bravo !";
    msgEl.style.color="var(--green)";
    speak(mistakeThisRound?"Bien rattrapé !":"Bravo !");
    if(!mistakeThisRound) markMastered(correct);
    document.getElementById("nextBtn").style.display="block";
    document.getElementById("choices").querySelectorAll(".choice").forEach(b=>b.disabled=true);
  } else {
    mistakeThisRound=true;
    btn.classList.add("wrong");
    lives--; renderLives();
    markWeak(alphabet[queue[currentIdx]].letter);
    renderWeakPanel();
    speak("Essaie encore");
    if(lives<=0){
      answered=true;
      msgEl.innerHTML=`❌ C'était <strong>${correct}</strong>`;
      msgEl.style.color="var(--pink)";
      document.getElementById("nextBtn").style.display="block";
      document.getElementById("choices").querySelectorAll(".choice").forEach(b=>b.disabled=true);
    } else {
      msgEl.innerHTML=`😊 Essaie encore (${lives} ❤️ restant${lives>1?"s":""})`;
      msgEl.style.color="var(--pink)";
      setTimeout(()=>btn.classList.remove("wrong"),450);
    }
  }
}

/* ══════════════════════════════════════
   CONFETTI
══════════════════════════════════════ */
function launchConfetti(){
  const wrap=document.createElement("div");
  wrap.className="confetti-wrap"; document.body.appendChild(wrap);
  const colors=["#ff4d6d","#3a86ff","#ffd166","#06d6a0","#c77dff","#ff9f1c"];
  for(let i=0;i<80;i++){
    const p=document.createElement("div"); p.className="confetti-piece";
    p.style.left             =Math.random()*100+"vw";
    p.style.background       =colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.5+Math.random()*2)+"s";
    p.style.animationDelay   =(Math.random()*1.2)+"s";
    p.style.width            =(8+Math.random()*8)+"px";
    p.style.height           =(10+Math.random()*12)+"px";
    p.style.borderRadius     =Math.random()>.5?"50%":"2px";
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),4000);
}

/* ══════════════════════════════════════
   SHOW FINAL SCREEN
══════════════════════════════════════ */
function showFinalScreen(){
  if(score>getBest()) setBest(score);
  const pct=score/queue.length;
  const stars=pct>=.9?"⭐⭐⭐":pct>=.65?"⭐⭐":"⭐";
  if(pct>=.65) launchConfetti();

  const wl=getWeakLetters();
  const modeLabel=mode==='weak'?"les lettres difficiles":"l'alphabet";

  document.getElementById("finalSubtitle").textContent=`Tu as terminé ${modeLabel} !`;
  document.getElementById("finalStars").textContent=stars;
  document.getElementById("finalScore").textContent=`⭐ ${score} / ${queue.length}`;
  document.getElementById("finalBest").textContent=`Meilleur score : ${getBest()}/${alphabet.length}`;

  if(wl.length){
    document.getElementById("finalWeakSummary").innerHTML=`
      <div class="weak-summary">
        <h3>🔴 Encore à travailler :</h3>
        <div class="weak-letters" style="justify-content:center;margin-top:6px;">
          ${wl.map(l=>`<span class="weak-tag">${l}</span>`).join("")}
        </div>
      </div>`;
    document.getElementById("retryWeakBtn").style.display="";
  } else {
    document.getElementById("finalWeakSummary").innerHTML=
      `<p style="margin-top:16px;color:var(--green);font-weight:800;font-size:1.1rem;">🟢 Toutes les lettres sont maîtrisées !</p>`;
    document.getElementById("retryWeakBtn").style.display="none";
  }

  showFinal();
  speak("Bravo, tu as terminé !");
}

/* ══════════════════════════════════════
   BUTTONS (wired once, always present)
══════════════════════════════════════ */
document.getElementById("listenBtn").onclick=()=>{
  const d=alphabet[queue[currentIdx]];
  speak(`${d.letter} comme ${d.word}`);
};

document.getElementById("nextBtn").onclick=()=>{
  currentIdx++;
  if(currentIdx>=queue.length){ showFinalScreen(); return; }
  loadQuestion();
};

document.getElementById("restartBtn").onclick=()=>{
  buildQueue('full');
  loadQuestion();
};

document.getElementById("retryWeakBtn").onclick=()=>{
  buildQueue('weak');
  loadQuestion();
};

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
buildQueue('full');
loadQuestion();
</script>
</body>
</html>
